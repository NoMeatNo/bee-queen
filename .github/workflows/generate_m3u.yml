name: Generate M3U
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run script
        run: python generate_m3u.py

      - name: Commit and Push M3U
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-generate hublive.m3u"
          file_pattern: "hublive.m3u"
          branch: "generated-m3u"
          create_branch: true
